name: Build OMTV

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==================== Android APK ====================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # SourceForge 持续不可用时改用 GitHub release 作为 MDK SDK 镜像；
    # fvp 通过 FVP_DEPS_URL 覆盖默认 nightly 下载地址
    env:
      FVP_DEPS_URL: https://github.com/wang-bin/mdk-sdk/releases/download/v0.36.0
      OMPLAYER_KEYSTORE: /home/runner/.android/omplayer.keystore
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Create Android project files
        run: flutter create . --platforms=android --org com.coollightxp --project-name omplayer

      - name: Apply app icon (视频取景框)
        run: |
          cp branding/android/mipmap-mdpi/ic_launcher.png    android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp branding/android/mipmap-hdpi/ic_launcher.png    android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp branding/android/mipmap-xhdpi/ic_launcher.png   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp branding/android/mipmap-xxhdpi/ic_launcher.png  android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp branding/android/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Patch Android config (cleartext HTTP / cutout fullscreen)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # 应用名改为 欧米电视（flutter create 默认写 project-name）
          sed -i 's|android:label="omplayer"|android:label="欧米电视"|' $MANIFEST
          # IPTV 源多为 http:// 明文地址，必须允许明文流量
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' $MANIFEST
          # 单实例：从图标再次启动时回到已有任务而不是新开进程
          # 模板自带 singleTop，必须替换成 singleTask（新增会变成重复属性、Manifest 直接非法）
          if ! grep -q 'android:launchMode="singleTask"' $MANIFEST; then
            if grep -q 'android:launchMode="singleTop"' $MANIFEST; then
              sed -i 's|android:launchMode="singleTop"|android:launchMode="singleTask"|' $MANIFEST
            else
              sed -i 's|android:name=".MainActivity"|android:name=".MainActivity"\n            android:launchMode="singleTask"|' $MANIFEST
            fi
          fi
          grep -q 'android:launchMode="singleTask"' $MANIFEST || { echo "::error::singleTask 未写入 AndroidManifest"; exit 1; }
          # 显式声明网络权限（video_player 会合并，但显式更稳）
          grep -q "android.permission.INTERNET" $MANIFEST || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' $MANIFEST
          # TV 盒子可装可用：不强制触摸屏；声明 leanback 非必需（Android TV
          # 桌面/应用市场可见，手机安装不受影响）
          grep -q "android.software.leanback" $MANIFEST || sed -i 's|<application|<uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <uses-feature android:name="android.software.leanback" android:required="false" />\n    <application|' $MANIFEST
          # 挖孔/刘海屏全屏不留黑边
          mkdir -p android/app/src/main/res/values-v28
          cat > android/app/src/main/res/values-v28/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          XML

      # 系统画中画（浮窗小窗）+ 听电视通知卡片（前台服务）：
      # android/ 由 flutter create 现场生成，原生通道只能在这里写进去
      - name: Patch Android PiP / audio notification service
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # 同样锚在 .MainActivity 行追加 PiP 属性（不依赖上一步是否匹配到）
          grep -q 'supportsPictureInPicture' $MANIFEST || sed -i 's|android:name=".MainActivity"|android:name=".MainActivity"\n            android:supportsPictureInPicture="true"\n            android:resizeableActivity="true"|' $MANIFEST
          grep -q 'supportsPictureInPicture' $MANIFEST || { echo "::error::PiP 属性未写入 AndroidManifest"; exit 1; }
          # 听电视：Android 14 起媒体播放前台服务必须声明类型与对应权限
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' $MANIFEST || sed -i 's|<application|<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application|' $MANIFEST
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' $MANIFEST || { echo "::error::前台服务权限未写入 AndroidManifest"; exit 1; }
          # 听电视退后台后要保持 CPU 不休眠，否则网页音频会停
          grep -q 'android.permission.WAKE_LOCK' $MANIFEST || sed -i 's|<application|<uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application|' $MANIFEST
          grep -q 'android.permission.WAKE_LOCK' $MANIFEST || { echo "::error::唤醒锁权限未写入 AndroidManifest"; exit 1; }
          # DLNA/SSDP 依赖组播：不声明该权限安卓会过滤组播包，手机扫描不到设备
          grep -q 'CHANGE_WIFI_MULTICAST_STATE' $MANIFEST || sed -i 's|<application|<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n    <application|' $MANIFEST
          grep -q 'CHANGE_WIFI_MULTICAST_STATE' $MANIFEST || { echo "::error::组播权限未写入 AndroidManifest"; exit 1; }
          grep -q 'AudioPlaybackService' $MANIFEST || sed -i 's|</application>|    <service android:name=".AudioPlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>|' $MANIFEST
          grep -q 'AudioPlaybackService' $MANIFEST || { echo "::error::音频前台服务未写入 AndroidManifest"; exit 1; }
          grep -q 'foregroundServiceType="mediaPlayback"' $MANIFEST || { echo "::error::前台服务缺少 mediaPlayback 类型"; exit 1; }
          KS_DIR=android/app/src/main/kotlin/com/coollightxp/omplayer
          mkdir -p $KS_DIR
          cat > $KS_DIR/AudioPlaybackService.kt <<'KOTLIN'
          package com.coollightxp.omplayer

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.drawable.Icon
          import android.media.MediaMetadata
          import android.media.session.MediaSession
          import android.media.session.PlaybackState
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager

          /**
           * 听电视：前台服务 + 媒体通知卡片
           * - 卡片内容：频道名 + 正在播节目 + 播放状态
           * - 动作按钮：上一台 / 播放暂停 / 下一台 / 关闭（回 App 并切回画面）
           * - 按钮命令通过广播回传 MainActivity，再由 MethodChannel 转给 Flutter
           */
          class AudioPlaybackService : Service() {

              companion object {
                  const val CHANNEL_ID = "omtv_audio"
                  const val NOTIF_ID = 4101

                  const val ACT_PLAY_PAUSE = "com.coollightxp.omplayer.ACTION_PLAY_PAUSE"
                  const val ACT_PREV = "com.coollightxp.omplayer.ACTION_PREV"
                  const val ACT_NEXT = "com.coollightxp.omplayer.ACTION_NEXT"

                  /** 服务 → Activity 的指令广播 */
                  const val ACTION_CMD = "com.coollightxp.omplayer.AUDIO_CMD"
                  const val EXTRA_CMD = "cmd"

                  /** 已在运行：后续只更新内容，避免安卓 12+ 后台启动前台服务限制 */
                  private var running = false

                  fun start(ctx: Context, name: String, program: String, playing: Boolean) {
                      val i = Intent(ctx, AudioPlaybackService::class.java).apply {
                          action = "update"
                          putExtra("name", name)
                          putExtra("program", program)
                          putExtra("playing", playing)
                      }
                      try {
                          if (running) {
                              // 服务已是前台服务：普通 startService 允许（前台服务状态豁免）
                              ctx.startService(i)
                          } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              ctx.startForegroundService(i)
                          } else {
                              ctx.startService(i)
                          }
                      } catch (e: Exception) {
                          try {
                              ctx.startService(i)
                          } catch (_: Exception) {
                          }
                      }
                  }

                  fun stop(ctx: Context) {
                      ctx.stopService(Intent(ctx, AudioPlaybackService::class.java))
                  }
              }

              private var session: MediaSession? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private var curName: String = ""
              private var curProgram: String = ""
              private var playing: Boolean = true

              private val actionReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          ACT_PLAY_PAUSE -> emit("playpause")
                          ACT_PREV -> emit("prev")
                          ACT_NEXT -> emit("next")
                      }
                  }
              }

              private fun emit(cmd: String) {
                  sendBroadcast(
                      Intent(ACTION_CMD).setPackage(packageName).putExtra(EXTRA_CMD, cmd)
                  )
              }

              override fun onBind(intent: Intent?): IBinder? = null

              @Suppress("DEPRECATION")
              override fun onCreate() {
                  super.onCreate()
                  running = true
                  createChannel()
                  // 退后台/息屏后网页音频要继续出声：前台服务本身不阻止 CPU 休眠，
                  // 必须自己持有一个 PARTIAL_WAKE_LOCK（6 小时后自动释放，防止忘记）
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "omtv:audio")
                      wakeLock?.setReferenceCounted(false)
                      wakeLock?.acquire(6 * 60 * 60 * 1000L)
                  } catch (_: Exception) {
                  }
                  session = MediaSession(this, "OMTV").apply {
                      setCallback(object : MediaSession.Callback() {
                          override fun onPlay() = emit("playpause")
                          override fun onPause() = emit("playpause")
                          override fun onSkipToNext() = emit("next")
                          override fun onSkipToPrevious() = emit("prev")
                          override fun onStop() {
                              emit("stop")
                              stopSelf()
                          }
                      })
                      isActive = true
                  }
                  val f = IntentFilter().apply {
                      addAction(ACT_PLAY_PAUSE)
                      addAction(ACT_PREV)
                      addAction(ACT_NEXT)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(actionReceiver, f, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(actionReceiver, f)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  intent?.let {
                      curName = it.getStringExtra("name") ?: curName
                      curProgram = it.getStringExtra("program") ?: curProgram
                      playing = it.getBooleanExtra("playing", playing)
                  }
                  val n = buildNotification()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(
                          NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK
                      )
                  } else {
                      startForeground(NOTIF_ID, n)
                  }
                  updateSession()
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  running = false
                  try { if (wakeLock?.isHeld == true) wakeLock?.release() } catch (_: Exception) {
                  }
                  wakeLock = null
                  try {
                      unregisterReceiver(actionReceiver)
                  } catch (_: Exception) {
                  }
                  session?.isActive = false
                  session?.release()
                  session = null
                  super.onDestroy()
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (nm.getNotificationChannel(CHANNEL_ID) == null) {
                      nm.createNotificationChannel(
                          NotificationChannel(
                              CHANNEL_ID, "听电视", NotificationManager.IMPORTANCE_LOW
                          ).apply {
                              description = "听电视后台播放控制"
                              setShowBadge(false)
                          }
                      )
                  }
              }

              @Suppress("DEPRECATION")
              private fun newBuilder(): Notification.Builder =
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL_ID)
                  } else {
                      Notification.Builder(this)
                  }

              /** 通知按钮：走广播而不是 startService，避免前台服务超时异常 */
              private fun broadcastPi(action: String, code: Int): PendingIntent {
                  val i = Intent(action).setPackage(packageName)
                  var fl = PendingIntent.FLAG_UPDATE_CURRENT
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      fl = fl or PendingIntent.FLAG_IMMUTABLE
                  }
                  return PendingIntent.getBroadcast(this, code, i, fl)
              }

              /**
               * 点击卡片 / 关闭：用 getActivity 的 PendingIntent 拉回前台。
               * Android 10+ 禁止后台组件直接 startActivity，用户点通知属于豁免场景。
               */
              private fun openActivityPi(code: Int, closeAudio: Boolean): PendingIntent {
                  val i = Intent(this, MainActivity::class.java)
                      .addFlags(
                          Intent.FLAG_ACTIVITY_SINGLE_TOP or
                              Intent.FLAG_ACTIVITY_NEW_TASK or
                              Intent.FLAG_ACTIVITY_REORDER_TO_FRONT
                      )
                      .putExtra("restoreVideo", true)
                      .putExtra("closeAudio", closeAudio)
                  var fl = PendingIntent.FLAG_UPDATE_CURRENT
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      fl = fl or PendingIntent.FLAG_IMMUTABLE
                  }
                  return PendingIntent.getActivity(this, code, i, fl)
              }

              private fun actionOf(
                  iconId: Int,
                  title: String,
                  pending: PendingIntent
              ): Notification.Action =
                  Notification.Action.Builder(
                      Icon.createWithResource(this, iconId), title, pending
                  ).build()

              private fun appIcon(): Bitmap? = try {
                  BitmapFactory.decodeResource(resources, applicationInfo.icon)
              } catch (_: Exception) {
                  null
              }

              private fun buildNotification(): Notification {
                  val b = newBuilder()
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle(curName.ifEmpty { "欧米电视" })
                      .setContentText(
                          if (curProgram.isNotEmpty()) "正在播 $curProgram" else "音频播放中"
                      )
                      .setContentIntent(openActivityPi(1, true))
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                  appIcon()?.let { b.setLargeIcon(it) }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      b.setStyle(
                          Notification.MediaStyle()
                              .setMediaSession(session?.sessionToken)
                              .setShowActionsInCompactView(0, 1, 2)
                      )
                  }
                  b.addAction(
                      actionOf(
                          android.R.drawable.ic_media_previous, "上一台",
                          broadcastPi(ACT_PREV, 2)
                      )
                  )
                  b.addAction(
                      actionOf(
                          if (playing) android.R.drawable.ic_media_pause
                          else android.R.drawable.ic_media_play,
                          if (playing) "暂停" else "播放",
                          broadcastPi(ACT_PLAY_PAUSE, 3)
                      )
                  )
                  b.addAction(
                      actionOf(
                          android.R.drawable.ic_media_next, "下一台",
                          broadcastPi(ACT_NEXT, 4)
                      )
                  )
                  b.addAction(
                      actionOf(
                          android.R.drawable.ic_menu_close_clear_cancel, "关闭",
                          openActivityPi(5, true)
                      )
                  )
                  return b.build()
              }

              private fun updateSession() {
                  val s = session ?: return
                  s.setMetadata(
                      MediaMetadata.Builder()
                          .putString(
                              MediaMetadata.METADATA_KEY_TITLE, curName.ifEmpty { "欧米电视" }
                          )
                          .putString(MediaMetadata.METADATA_KEY_ARTIST, curProgram)
                          .build()
                  )
                  s.setPlaybackState(
                      PlaybackState.Builder()
                          .setActions(
                              PlaybackState.ACTION_PLAY or PlaybackState.ACTION_PAUSE or
                                  PlaybackState.ACTION_PLAY_PAUSE or
                                  PlaybackState.ACTION_SKIP_TO_NEXT or
                                  PlaybackState.ACTION_SKIP_TO_PREVIOUS or
                                  PlaybackState.ACTION_STOP
                          )
                          .setState(
                              if (playing) PlaybackState.STATE_PLAYING
                              else PlaybackState.STATE_PAUSED,
                              PlaybackState.PLAYBACK_POSITION_UNKNOWN, 1f
                          )
                          .build()
                  )
              }
          }
          KOTLIN
          cat > $KS_DIR/MainActivity.kt <<'KOTLIN'
          package com.coollightxp.omplayer

          import android.Manifest
          import android.app.PictureInPictureParams
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.content.res.Configuration
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.util.Rational
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private var channel: MethodChannel? = null

              /** DLNA/SSDP 组播锁（见 acquireMulticastLock） */
              private var multicastLock: android.net.wifi.WifiManager.MulticastLock? = null

              /** 听电视卡片按钮：原生广播 → Flutter（activity 退到后台也保持注册） */
              private val audioCmdReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val cmd = intent?.getStringExtra(AudioPlaybackService.EXTRA_CMD)
                      if (!cmd.isNullOrEmpty()) channel?.invokeMethod("audio", cmd)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  ensureNotificationPermission()
                  acquireMulticastLock()
              }

              /** DLNA/SSDP 组播锁：安卓默认过滤组播包（尤其 WiFi 省电模式），
               *  不持锁时投屏端 M-SEARCH/NOTIFY 可能收不到，表现为“扫描不到”
               *  或隔一段时间才扫描到。锁跟随 Activity 生命周期，退出即释放。 */
              private fun acquireMulticastLock() {
                  try {
                      if (multicastLock != null) return
                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE)
                          as? android.net.wifi.WifiManager ?: return
                      val lock = wm.createMulticastLock("omtv_dlna")
                      lock.setReferenceCounted(false)
                      lock.acquire()
                      multicastLock = lock
                  } catch (_: Exception) {
                  }
              }

              private fun releaseMulticastLock() {
                  try {
                      multicastLock?.release()
                  } catch (_: Exception) {
                  }
                  multicastLock = null
              }

              /** 是否电视端：盒子/电视没有可操作的通知栏，不需要通知权限 */
              private fun isTvDevice(): Boolean {
                  val pm = packageManager
                  val uiMode = (getSystemService(Context.UI_MODE_SERVICE)
                      as? android.app.UiModeManager)?.currentModeType
                      ?: Configuration.UI_MODE_TYPE_UNDEFINED
                  return pm.hasSystemFeature(PackageManager.FEATURE_LEANBACK) ||
                      pm.hasSystemFeature(PackageManager.FEATURE_TELEVISION) ||
                      pm.hasSystemFeature("android.hardware.type.television") ||
                      uiMode == Configuration.UI_MODE_TYPE_TELEVISION
              }

              /** 通知权限是否已具备（Android 13 以下无需运行时权限） */
              private fun hasNotificationPermission(): Boolean =
                  Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU ||
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) ==
                      PackageManager.PERMISSION_GRANTED

              /** 申请通知权限（Android 13+）：
               *  - 电视端跳过：听电视卡片就在画面上，不靠通知栏
               *  - 已授权、或系统已永久拒绝（不再弹框）→ 不打扰
               *  - 首次启动 / 上次只是普通拒绝（系统仍允许弹框）→ 每次冷启动再问，
               *    避免「只问一次，拒绝后通知卡片永远出不来」 */
              private fun ensureNotificationPermission() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU) return
                  if (isTvDevice()) return
                  if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                      == PackageManager.PERMISSION_GRANTED) return
                  val prefs = getSharedPreferences("omtv_native", MODE_PRIVATE)
                  val askedBefore = prefs.getBoolean("notif_asked", false)
                  // 请求过一次且系统不再允许弹框 = 永久拒绝，只能去系统设置手动开
                  if (askedBefore &&
                      !shouldShowRequestPermissionRationale(
                          Manifest.permission.POST_NOTIFICATIONS)) return
                  prefs.edit().putBoolean("notif_asked", true).apply()
                  try {
                      requestPermissions(
                          arrayOf(Manifest.permission.POST_NOTIFICATIONS), 4101)
                  } catch (_: Exception) {
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  channel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "omtv/pip")
                  channel?.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "enter" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  try {
                                      val params = PictureInPictureParams.Builder()
                                          .setAspectRatio(Rational(16, 9))
                                          .build()
                                      setPictureInPictureParams(params)
                                      result.success(enterPictureInPictureMode(params))
                                  } catch (e: Exception) {
                                      result.success(false)
                                  }
                              } else {
                                  result.success(false)
                              }
                          }
                          "exit" -> result.success(true)
                          "background" -> {
                              moveTaskToBack(true)
                              result.success(true)
                          }
                          "audioUpdate" -> {
                              AudioPlaybackService.start(
                                  this,
                                  call.argument<String>("name") ?: "",
                                  call.argument<String>("program") ?: "",
                                  call.argument<Boolean>("playing") ?: true
                              )
                              result.success(true)
                          }
                          "audioStop" -> {
                              AudioPlaybackService.stop(this)
                              result.success(true)
                          }
                          // 电视端检测：盒子/电视没有可操作的通知栏，
                          // 听电视要一直留在卡片上
                          "isTv" -> result.success(isTvDevice())
                          // 通知权限状态：没权限时隐藏窗口就没有可操作的卡片，
                          // Dart 侧会因此不退后台
                          "notifGranted" -> result.success(hasNotificationPermission())
                          // 打开本应用的通知设置页（引导用户手动开启权限）
                          "openNotifSettings" -> {
                              try {
                                  val i = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                      Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS)
                                          .putExtra(Settings.EXTRA_APP_PACKAGE, packageName)
                                  } else {
                                      Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS)
                                          .setData(android.net.Uri.parse("package:$packageName"))
                                  }
                                  startActivity(i)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
                  val f = IntentFilter(AudioPlaybackService.ACTION_CMD)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(audioCmdReceiver, f, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(audioCmdReceiver, f)
                  }
                  handleAudioIntent(intent)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleAudioIntent(intent)
              }

              /** 卡片点击/关闭：回到前台后让 Flutter 退出听电视、恢复画面 */
              private fun handleAudioIntent(intent: Intent?) {
                  if (intent == null) return
                  if (intent.getBooleanExtra("closeAudio", false)) {
                      intent.removeExtra("closeAudio")
                      intent.removeExtra("restoreVideo")
                      channel?.invokeMethod("audio", "stop")
                  } else if (intent.getBooleanExtra("restoreVideo", false)) {
                      intent.removeExtra("restoreVideo")
                      channel?.invokeMethod("audio", "restore")
                  }
              }

              override fun onDestroy() {
                  try {
                      unregisterReceiver(audioCmdReceiver)
                  } catch (_: Exception) {
                  }
                  releaseMulticastLock()
                  super.onDestroy()
              }

              override fun onPictureInPictureModeChanged(
                  isInPictureInPictureMode: Boolean,
                  newConfig: Configuration
              ) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                  channel?.invokeMethod("pip", isInPictureInPictureMode)
              }
          }
          KOTLIN

      - name: Install dependencies
        run: flutter pub get

      # flutter_inappwebview_android 1.1.x 自身 build.gradle 仍引用已被新版
      # AGP 拒绝的 proguard-android.txt，pub get 后就地替换
      - name: Patch flutter_inappwebview proguard file
        run: |
          find "$HOME/.pub-cache" -path "*flutter_inappwebview_android-*/android/build.gradle" -print0 \
            | xargs -0 -r sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g"

      - name: Cache Android keystore
        id: ks-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/omplayer.keystore
          key: omplayer-keystore-v4-${{ runner.os }}

      - name: Ensure stable keystore (validate secret; regenerate when corrupt)
        run: |
          set -e
          KS="$HOME/.android/omplayer.keystore"
          mkdir -p "$HOME/.android"
          validate_ks() {
            keytool -list -keystore "$KS" -storepass android \
              -alias androiddebugkey >/dev/null 2>&1
          }
          SECRET_B64="${{ secrets.DEBUG_KEYSTORE_BASE64 }}"
          if [ -n "$SECRET_B64" ]; then
            printf '%s' "$SECRET_B64" | base64 -d > "$KS" || true
            if validate_ks; then
              echo "Using keystore from repository secret (stable signature)"
            else
              echo "::warning::Secret DEBUG_KEYSTORE_BASE64 已损坏（无法用 android/androiddebugkey 打开），将重新生成；请用本次日志末尾的新值更新 Secret"
              SECRET_B64=""
            fi
          fi
          if [ -z "$SECRET_B64" ]; then
            if [ "${{ steps.ks-cache.outputs.cache-hit }}" = "true" ] && validate_ks; then
              echo "Using cached keystore"
            else
              echo "Generating new stable keystore (签名与手机上现有版本不同，仍需卸载一次)"
              rm -f "$KS"
              keytool -genkey -v \
                -keystore "$KS" \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=OMTV,O=OMTV,C=CN"
              # 输出新 base64：请更新 GitHub Secret，之后所有版本签名固定
              echo "=== DEBUG_KEYSTORE_BASE64 (用此整行更新 GitHub Secret) ==="
              base64 -w 0 "$KS"
              echo ""
              echo "=== END ==="
            fi
          fi
          echo "Keystore 证书指纹（构建后 APK 必须与此一致）:"
          keytool -list -v -keystore "$KS" -storepass android \
            -alias androiddebugkey 2>/dev/null | grep -E 'SHA256:' | head -1

      # android/ 目录由 flutter create 现场生成，无法在仓库里写死
      # signingConfig。通过 Gradle init 脚本强制 release 变体使用上面
      # 经验证的 keystore：文件损坏/口令不符时构建直接失败，
      # 杜绝 AGP 静默生成随机 CN=Android Debug 证书导致签名漂移。
      - name: Install Gradle init script (explicit release signing)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/omplayer-signing.gradle" <<'GRADLE'
          allprojects {
              afterEvaluate { p ->
                  if (p.plugins.hasPlugin('com.android.application')) {
                      def ksPath = System.getenv('OMPLAYER_KEYSTORE')
                      if (ksPath == null) {
                          throw new GradleException('OMPLAYER_KEYSTORE env is not set')
                      }
                      def ksFile = new File(ksPath)
                      if (!ksFile.isFile()) {
                          throw new GradleException("keystore not found: ${ksPath}")
                      }
                      def android = p.extensions.getByName('android')
                      def scs = android.signingConfigs
                      def sc = scs.findByName('omplayerStable') ?: scs.create('omplayerStable')
                      sc.storeFile = ksFile
                      sc.storePassword = 'android'
                      sc.keyAlias = 'androiddebugkey'
                      sc.keyPassword = 'android'
                      android.buildTypes.getByName('release').signingConfig = sc
                  }
              }
          }
          GRADLE

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs for release
        run: |
          cd build/app/outputs/flutter-apk
          for abi in armeabi-v7a arm64-v8a x86_64; do
            if [ -f "app-$abi-release.apk" ]; then
              mv "app-$abi-release.apk" "OMTV-android-$abi.apk"
            fi
          done

      # 构建后核对：APK 实际证书必须与构建前 keystore 指纹一致，
      # 一旦再次出现 CN=Android Debug 随机证书可立即发现
      - name: Verify APK signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null \
            | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs \
              build/app/outputs/flutter-apk/OMTV-android-arm64-v8a.apk \
              | grep -E 'signer|Certificate' | head -5
          else
            echo "apksigner not found, skipped"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/OMTV-android-*.apk

  # ==================== Web ====================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Create Web project files
        run: flutter create . --platforms=web --org com.coollightxp --project-name omplayer

      - name: Apply app icon (视频取景框)
        run: |
          cp branding/web/Icon-192.png web/icons/Icon-192.png
          cp branding/web/Icon-512.png web/icons/Icon-512.png
          cp branding/web/Icon-192.png web/icons/Icon-maskable-192.png
          cp branding/web/Icon-512.png web/icons/Icon-maskable-512.png
          cp branding/web/favicon.png web/favicon.png

      - name: Patch Web title / manifest
        run: |
          sed -i 's|<title>omplayer</title>|<title>OMTV</title>|' web/index.html
          sed -i 's|content="omplayer"|content="OMTV"|' web/index.html
          sed -i 's|"name": "omplayer"|"name": "OMTV"|' web/manifest.json
          sed -i 's|"short_name": "omplayer"|"short_name": "OMTV"|' web/manifest.json

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Zip Web build
        run: |
          cd build/web
          zip -r ../../OMTV-web.zip .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: OMTV-web.zip

  # ==================== Windows Desktop ====================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    # SourceForge 持续不可用时改用 GitHub release 作为 MDK SDK 镜像；
    # fvp 通过 FVP_DEPS_URL 覆盖默认 nightly 下载地址
    env:
      FVP_DEPS_URL: https://github.com/wang-bin/mdk-sdk/releases/download/v0.36.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Create Windows project files
        run: flutter create . --platforms=windows --org com.coollightxp --project-name omplayer

      - name: Apply app icon (视频取景框)
        shell: pwsh
        run: Copy-Item branding/app_icon.ico windows/runner/resources/app_icon.ico -Force

      - name: Set Windows executable name
        shell: pwsh
        run: |
          $c = 'windows/CMakeLists.txt'
          $t = [System.IO.File]::ReadAllText($c)
          $anchor = 'set(BINARY_NAME "omplayer")'
          if (-not $t.Contains($anchor)) {
            throw 'BINARY_NAME anchor not found, Flutter template may have changed'
          }
          $t = $t.Replace($anchor, 'set(BINARY_NAME "OMTV")')
          [System.IO.File]::WriteAllText($c, $t, (New-Object System.Text.UTF8Encoding($false)))

      # 仓库不提交 windows/ 目录（由 flutter create 现场生成），
      # 因此把 runner 级补丁注入生成的模板文件：
      # main.cpp:
      # 1) 单实例：命名互斥体，重复启动时激活已有窗口后退出
      # 2) NumLock 一次性恢复：Flutter 引擎初始化会把 NumLock 同步为
      #    关闭；启动前记住物理状态，3 秒后在 UI 线程恢复一次即永久
      #    解除定时器。绝不做持续守护——持续合成翻转会污染全局
      #    NumLock，导致切换到其它程序后小键盘也是关的
      # 3) WebView2 自动播放浏览器参数（无用户手势也可带声音起播）
      # flutter_window.cpp:
      # 4) WH_KEYBOARD_LL 低级键盘钩子 + MethodChannel：WebView2 获得
      #    焦点后吞掉全部按键，Flutter 收不到数字键；钩子在本进程前台
      #    时把 0-9/小键盘数字转发给 Dart 选台（设置面板打开时放行）
      - name: Patch Windows runner (single instance + NumLock + WebView2 autoplay + digit hotkey hook)
        shell: pwsh
        run: |
          $f = 'windows/runner/main.cpp'
          $t = [System.IO.File]::ReadAllText($f)
          $inject1 = @(
            '// ===== OMPlayer injected: single instance + one-shot NumLock restore =====',
            'static BOOL g_om_numlock_was_on = FALSE;',
            'static const wchar_t* kOmSingleInstanceMutex = L"Local\\OMTV_SingleInstance";',
            '// 一次性回调：触发后立刻 KillTimer，之后永不干预 NumLock，',
            '// 避免后台轮询读到滞后状态而反复翻转、污染全局键盘状态',
            'static VOID CALLBACK OMNumLockRestore(HWND hwnd, UINT, UINT_PTR id, DWORD) {',
            '  ::KillTimer(hwnd, id);',
            '  BOOL on = (::GetKeyState(VK_NUMLOCK) & 0x0001) != 0;',
            '  if (g_om_numlock_was_on != on) {',
            '    ::keybd_event(VK_NUMLOCK, 0x45, KEYEVENTF_EXTENDEDKEY, 0);',
            '    ::keybd_event(VK_NUMLOCK, 0x45, KEYEVENTF_EXTENDEDKEY | KEYEVENTF_KEYUP, 0);',
            '  }',
            '}',
            '// ===== OMPlayer injected: WebView2 cache cleanup on startup =====',
            '// 启动时清空纯缓存目录（Cache/Code Cache/GPUCache/Service Worker），',
            '// 文件夹臃肿会拖慢 WebView2 启动；保留 Cookies/Local Storage 登录态',
            '#include <filesystem>',
            'static void OMClearWebView2Cache() {',
            '  try {',
            '    wchar_t exePath[MAX_PATH];',
            '    DWORD n = ::GetModuleFileNameW(nullptr, exePath, MAX_PATH);',
            '    if (n == 0 || n >= MAX_PATH) return;',
            '    std::filesystem::path def =',
            '        std::filesystem::path(std::wstring(exePath, n) + L".WebView2");',
            '    std::error_code ec;',
            '    const wchar_t* dirs[] = {',
            '        L"Cache", L"Code Cache", L"GPUCache", L"Service Worker"};',
            '    for (const wchar_t* d : dirs) {',
            '      std::filesystem::remove_all(def / d, ec);',
            '    }',
            '  } catch (...) {}',
            '}',
            '// ===== end injected code =====',
            'int APIENTRY wWinMain('
          ) -join "`r`n"
          $inject2 = @(
            '  // OMPlayer: 允许内嵌 WebView2 无用户手势自动播放（带声音）。',
            '  // 必须在任何 WebView2 环境创建前设置，进程级生效；',
            '  // disk-cache-size 256MB，加速二次加载',
            '  ::SetEnvironmentVariableW(L"WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS",',
            '      L"--autoplay-policy=no-user-gesture-required --disk-cache-size=268435456");',
            '',
            '  // OMPlayer: 在任何 WebView2 环境创建前清理磁盘缓存',
            '  OMClearWebView2Cache();',
            '',
            '  ::CoInitializeEx(nullptr, COINIT_APARTMENTTHREADED);',
            '',
            '  // OMPlayer: allow only one running instance',
            '  HANDLE om_mutex = ::CreateMutexW(nullptr, TRUE, kOmSingleInstanceMutex);',
            '  (void)om_mutex; // hold for process lifetime; silences C4189 under /WX',
            '  if (::GetLastError() == ERROR_ALREADY_EXISTS) {',
            '    HWND existing = ::FindWindowW(L"FLUTTER_RUNNER_WIN32_WINDOW", L"OMTV");',
            '    if (existing != nullptr) {',
            '      ::ShowWindow(existing, SW_RESTORE);',
            '      ::SetForegroundWindow(existing);',
            '    }',
            '    return 0;',
            '  }',
            '  // 引擎键盘同步之前记住物理 NumLock 状态（GetKeyState 会',
            '  // 以当前全局状态初始化本线程键盘队列）',
            '  g_om_numlock_was_on = (::GetKeyState(VK_NUMLOCK) & 0x0001) != 0;'
          ) -join "`r`n"
          $inject3 = @(
            '  window.SetQuitOnClose(true);',
            '',
            '  // OMPlayer: 引擎初始化后 3 秒一次性恢复 NumLock 到启动前',
            '  // 状态，回调内自行 KillTimer，之后不再干预用户按键',
            '  ::SetTimer(nullptr, 0x4F4D, 3000, OMNumLockRestore);'
          ) -join "`r`n"
          $a1 = 'int APIENTRY wWinMain('
          $a2 = '  ::CoInitializeEx(nullptr, COINIT_APARTMENTTHREADED);'
          $a3 = '  window.SetQuitOnClose(true);'
          if (-not $t.Contains($a1) -or -not $t.Contains($a2) -or -not $t.Contains($a3)) {
            throw 'main.cpp anchor not found, Flutter template may have changed'
          }
          $t = $t.Replace($a1, $inject1)
          $t = $t.Replace($a2, $inject2)
          $t = $t.Replace($a3, $inject3)
          # 窗口标题改为 OMTV（单实例 FindWindowW 也按此标题查找）
          $t = $t.Replace('L"omplayer"', 'L"OMTV"')
          [System.IO.File]::WriteAllText($f, $t, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content $f | Select-String 'OMPlayer' | ForEach-Object { $_.Line.Trim() }

          # ===== flutter_window.cpp：数字键低级键盘钩子 + MethodChannel =====
          $fw = 'windows/runner/flutter_window.cpp'
          $wt = [System.IO.File]::ReadAllText($fw)
          $wIncAnchor = '#include "flutter/generated_plugin_registrant.h"'
          $wRegAnchor = 'RegisterPlugins(flutter_controller_->engine());'
          if (-not $wt.Contains($wIncAnchor) -or -not $wt.Contains($wRegAnchor)) {
            throw 'flutter_window.cpp anchor not found, Flutter template may have changed'
          }
          $wInc = @(
            '#include "flutter/generated_plugin_registrant.h"',
            '// ===== OMPlayer injected: low-level hotkeys + idle cursor hide =====',
            '// WebView2 is a separate HWND: once it has keyboard focus Flutter',
            '// never receives WM_KEYDOWN, so hotkeys die. WH_KEYBOARD_LL forwards',
            '// digits and control keys to Dart while this process is foreground.',
            '// WH_MOUSE_LL + timer hides the cursor after 3s idle (page CSS',
            '// cursor:none cannot reach cross-origin iframes).',
            '// Channel uses raw UTF-8 bytes (Dart side: BasicMessageChannel<String>).',
            '#include <windows.h>',
            '#include <cstring>',
            '#if __has_include(<flutter/flutter_messenger.h>)',
            '#include <flutter/flutter_messenger.h>',
            '#else',
            '#include <flutter_messenger.h>',
            '#endif',
            '#if __has_include(<flutter/flutter_plugin_registrar.h>)',
            '#include <flutter/flutter_plugin_registrar.h>',
            '#else',
            '#include <flutter_plugin_registrar.h>',
            '#endif',
            'namespace {',
            'FlutterDesktopMessengerRef g_om_messenger = nullptr;',
            '// TRUE = intercept hotkeys; Dart sets FALSE while settings panel open.',
            'volatile BOOL g_om_capture = TRUE;',
            '// TRUE = hide cursor after 3s idle; Dart enables while web foreground.',
            'volatile BOOL g_om_cursor_hide = FALSE;',
            '// TRUE = web page owns keyboard focus: hook must swallow+forward keys;',
            '// FALSE = normal video UI: pass keys through so Flutter gets full',
            '// down/up sequences for long-press detection.',
            'volatile BOOL g_om_web_forward = FALSE;',
            'DWORD g_om_last_mouse_tick = 0;',
            'bool g_om_mouse_hidden = false;',
            'void OMShowCursorAgain() {',
            '  if (g_om_mouse_hidden) {',
            '    g_om_mouse_hidden = false;',
            '    // 恢复光标显示计数到 >= 0',
            '    while (::ShowCursor(TRUE) < 0) {}',
            '  }',
            '}',
            'bool OMForegroundIsOurs() {',
            '  DWORD pid = 0;',
            '  ::GetWindowThreadProcessId(::GetForegroundWindow(), &pid);',
            '  return pid == ::GetCurrentProcessId();',
            '}',
            '// Dart -> C++: "1"/"0" capture toggle, "C1"/"C0" cursor-hide toggle,',
            '// "W1"/"W0" web-forward toggle',
            'void OMMessengerCallback(FlutterDesktopMessengerRef messenger,',
            '                         const FlutterDesktopMessage* message,',
            '                         void* user_data) {',
            '  if (message->message != nullptr && message->message_size >= 1) {',
            '    const uint8_t* m = message->message;',
            '    if (m[0] == 0x43) {  // "C1"/"C0": cursor-hide enable/disable',
            '      g_om_cursor_hide =',
            '          (message->message_size >= 2 && m[1] == 0x31) ? TRUE : FALSE;',
            '      if (!g_om_cursor_hide) OMShowCursorAgain();',
            '    } else if (m[0] == 0x57) {  // "W1"/"W0": web-forward enable/disable',
            '      g_om_web_forward =',
            '          (message->message_size >= 2 && m[1] == 0x31) ? TRUE : FALSE;',
            '    } else {  // "1"/"0": hotkey capture enable/disable',
            '      g_om_capture = (m[0] == 0x31) ? TRUE : FALSE;',
            '    }',
            '  }',
            '  ::FlutterDesktopMessengerSendResponse(',
            '      messenger, message->response_handle, nullptr, 0);',
            '}',
            'LRESULT CALLBACK OMLowLevelKeyboardProc(int n_code, WPARAM w_param,',
            '                                         LPARAM l_param) {',
            '  if (n_code == HC_ACTION &&',
            '      (w_param == WM_KEYDOWN || w_param == WM_SYSKEYDOWN ||',
            '       w_param == WM_KEYUP || w_param == WM_SYSKEYUP)) {',
            '    const bool is_down =',
            '        (w_param == WM_KEYDOWN || w_param == WM_SYSKEYDOWN);',
            '    const KBDLLHOOKSTRUCT* kb =',
            '        reinterpret_cast<const KBDLLHOOKSTRUCT*>(l_param);',
            '    int digit = -1;',
            '    const char* action = nullptr;',
            '    // Browser Back is always swallowed: stop WebView history',
            '    // navigation and let Dart do hierarchical back handling.',
            '    bool force_swallow = false;',
            '    if (kb->vkCode == VK_BROWSER_BACK) {',
            '      action = "back";',
            '      force_swallow = true;',
            '    } else if (kb->vkCode >= 0x30 && kb->vkCode <= 0x39) {',
            '      digit = static_cast<int>(kb->vkCode - 0x30);',
            '    } else if (kb->vkCode >= VK_NUMPAD0 && kb->vkCode <= VK_NUMPAD9) {',
            '      digit = static_cast<int>(kb->vkCode - VK_NUMPAD0);',
            '    } else {',
            '      switch (kb->vkCode) {',
            '        case VK_SPACE: action = "space"; break;',
            '        case VK_RETURN: action = "ok"; break;',
            '        case VK_LEFT: action = "left"; break;',
            '        case VK_RIGHT: action = "right"; break;',
            '        case VK_UP: action = "up"; break;',
            '        case VK_DOWN: action = "down"; break;',
            '        case VK_ESCAPE: action = "esc"; break;',
            '        case VK_APPS: action = "menu"; break;',
            '        case 0x4D: action = "m"; break;',
            '        case 0x46: action = "f"; break;',
            '        case 0x52: action = "r"; break;',
            '        case 0x43: action = "c"; break;',
            '        case 0x45: action = "e"; break;',
            '        case 0x53: action = "s"; break;',
            '        case 0x4C: action = "l"; break;',
            '        case 0x54: action = "t"; break;',
            '        default: break;',
            '      }',
            '    }',
            '    const bool matched = digit >= 0 || action != nullptr;',
            '    // Remote-capture mode (g_om_capture): swallow every matched key',
            '    // and forward ONLY via the win_hotkeys channel. Previously the key',
            '    // was also passed through to Flutter, so one physical press was',
            '    // handled twice (hook message + native Flutter key event): arrow',
            '    // keys moved two rows, OK fired twice (channel 2 -> ~10, EPG',
            '    // reserved several later programs). Settings panel calls',
            '    // setCapture(false), which clears g_om_capture, so text input',
            '    // still receives keys normally.',
            '    const bool swallow_mode =',
            '        force_swallow || g_om_capture;',
            '    if (matched && swallow_mode) {',
            '      const bool has_modifier =',
            '          (::GetKeyState(VK_SHIFT) & 0x8000) != 0 ||',
            '          (::GetKeyState(VK_CONTROL) & 0x8000) != 0 ||',
            '          (::GetKeyState(VK_MENU) & 0x8000) != 0;',
            '      if (!has_modifier && g_om_messenger != nullptr &&',
            '          OMForegroundIsOurs()) {',
            '        if (digit >= 0) {',
            '          // digits: forward on keydown only, no auto-repeat flood',
            '          if (is_down) {',
            '            const uint8_t msg = static_cast<uint8_t>(0x30 + digit);',
            '            ::FlutterDesktopMessengerSend(g_om_messenger,',
            '                "omplayer/win_hotkeys", &msg, 1);',
            '          }',
            '        } else {',
            '          // "k:xxx" keydown, "u:xxx" keyup',
            '          char buf[24];',
            '          const int n = ::wsprintfA(buf, is_down ? "k:%s" : "u:%s",',
            '                                    action);',
            '          if (n > 0) {',
            '            ::FlutterDesktopMessengerSend(g_om_messenger,',
            '                "omplayer/win_hotkeys",',
            '                reinterpret_cast<const uint8_t*>(buf),',
            '                static_cast<size_t>(n));',
            '          }',
            '        }',
            '        return 1;  // swallowed: not delivered to Flutter/WebView',
            '      }',
            '    }',
            '  }',
            '  return ::CallNextHookEx(nullptr, n_code, w_param, l_param);',
            '}',
            'LRESULT CALLBACK OMLowLevelMouseProc(int n_code, WPARAM w_param,',
            '                                    LPARAM l_param) {',
            '  if (n_code == HC_ACTION && w_param == WM_MOUSEMOVE) {',
            '    g_om_last_mouse_tick = ::GetTickCount();',
            '    OMShowCursorAgain();',
            '  }',
            '  return ::CallNextHookEx(nullptr, n_code, w_param, l_param);',
            '}',
            'VOID CALLBACK OMCursorTimerProc(HWND, UINT, UINT_PTR, DWORD) {',
            '  if (!g_om_cursor_hide) return;',
            '  if (g_om_last_mouse_tick == 0) {',
            '    g_om_last_mouse_tick = ::GetTickCount();',
            '    return;',
            '  }',
            '  if (!OMForegroundIsOurs()) return;',
            '  if (::GetTickCount() - g_om_last_mouse_tick >= 3000) {',
            '    if (!g_om_mouse_hidden) {',
            '      g_om_mouse_hidden = true;',
            '      // ShowCursor(FALSE) 递减显示计数到 < 0 隐藏光标。',
            '      // 基于计数，不会被 WM_SETCURSOR 覆盖（SetCursor 会被覆盖）。',
            '      while (::ShowCursor(FALSE) >= 0) {}',
            '    }',
            '  }',
            '}',
            '}  // namespace',
            '// ===== end injected code ====='
          ) -join "`r`n"
          $wReg = @(
            'RegisterPlugins(flutter_controller_->engine());',
            '  // OMPlayer: hotkey channel (Dart side: omplayer/win_hotkeys)',
            '  // 3.44+: GetRegistrarForPlugin returns the C registrar ref; use the',
            '  // C messenger API directly (C++ MethodChannel impl is not shipped).',
            '  auto om_registrar =',
            '      flutter_controller_->engine()->GetRegistrarForPlugin(',
            '          "OMPlayerHotkeys");',
            '  g_om_messenger = ::FlutterDesktopPluginRegistrarGetMessenger(',
            '      om_registrar);',
            '  ::FlutterDesktopMessengerSetCallback(g_om_messenger,',
            '      "omplayer/win_hotkeys", &OMMessengerCallback, nullptr);',
            '  ::SetWindowsHookExW(WH_KEYBOARD_LL, &OMLowLevelKeyboardProc,',
            '                      ::GetModuleHandleW(nullptr), 0);',
            '  ::SetWindowsHookExW(WH_MOUSE_LL, &OMLowLevelMouseProc,',
            '                      ::GetModuleHandleW(nullptr), 0);',
            '  ::SetTimer(nullptr, 0x4F43, 500, OMCursorTimerProc);'
          ) -join "`r`n"
          $wt = $wt.Replace($wIncAnchor, $wInc).Replace($wRegAnchor, $wReg)
          [System.IO.File]::WriteAllText($fw, $wt, (New-Object System.Text.UTF8Encoding($false)))
          'flutter_window.cpp: injected digit hotkey WH_KEYBOARD_LL hook'

          # flutter_inappwebview_windows 仍使用 /await + <experimental/coroutine>，
          # VS2026 (MSVC 14.51) 已将其升为硬错误；在顶层 CMakeLists 的插件
          # add_subdirectory 之前注入官方逃生宏（目录级定义传播给所有插件）。
          # 不同 Flutter 模板锚点不同（旧: add_subdirectory(flutter)，
          # 3.29+: add_subdirectory("${FLUTTER_MANAGED_DIR}" flutter)），逐一容错
          $cm = 'windows/CMakeLists.txt'
          $ct = [System.IO.File]::ReadAllText($cm)
          $macro = 'add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)'
          $anchors = @(
            'add_subdirectory("${FLUTTER_MANAGED_DIR}" flutter)',
            'add_subdirectory(flutter)'
          )
          $done = $false
          foreach ($a in $anchors) {
            if ($ct.Contains($a)) {
              $ct = $ct.Replace($a, "$macro`r`n$a")
              $done = $true
              break
            }
          }
          if (-not $done) {
            # 兜底：project() 声明之后插入（对后续所有 target 生效）
            $m = [regex]::Match($ct, '(project\s*\([^\)]*\))')
            if (-not $m.Success) { throw 'windows CMakeLists: no usable anchor' }
            $ct = $ct.Substring(0, $m.Groups[1].Index + $m.Groups[1].Length) + "`r`n$macro" + $ct.Substring($m.Groups[1].Index + $m.Groups[1].Length)
          }
          [System.IO.File]::WriteAllText($cm, $ct, (New-Object System.Text.UTF8Encoding($false)))
          'CMake: injected experimental coroutine silence define'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath OMTV-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: OMTV-windows.zip

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: OMTV-windows.zip

  # ==================== Linux Desktop ====================
  build-linux:
    name: Build Linux
    # 22.04：desktop_webview_window 的 Linux 端依赖 webkit2gtk-4.0，
    # 该包在 24.04 中已被移除（仅剩 4.1）
    runs-on: ubuntu-22.04
    # SourceForge 持续不可用时改用 GitHub release 作为 MDK SDK 镜像；
    # fvp 通过 FVP_DEPS_URL 覆盖默认 nightly 下载地址
    env:
      FVP_DEPS_URL: https://github.com/wang-bin/mdk-sdk/releases/download/v0.36.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libasound2-dev pkg-config libwebkit2gtk-4.0-dev libsoup-3.0-dev

      - name: Create Linux project files
        run: flutter create . --platforms=linux --org com.coollightxp --project-name omplayer

      # 窗口标题沿用 flutter create 写入的工程名，改为 OMTV
      - name: Patch Linux window title
        run: sed -i 's/"omplayer"/"OMTV"/g' linux/runner/my_application.cc

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Zip Linux build
        run: |
          cd build/linux/x64/release/bundle
          zip -r ${{ github.workspace }}/OMTV-linux.zip .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: OMTV-linux.zip

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: OMTV-linux.zip
